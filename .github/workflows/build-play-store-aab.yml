name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle for Play Store
        env:
          CAPACITOR_BUILD: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_PLAY_STORE_BUILD: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Verify web bundle
        run: test -f dist/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?Falta ANDROID_KEYSTORE_PASSWORD}"
            : "${ANDROID_KEY_ALIAS:?Falta ANDROID_KEY_ALIAS}"
            : "${ANDROID_KEY_PASSWORD:?Falta ANDROID_KEY_PASSWORD}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            GENERATED="false"
          else
            if [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
              STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            elif [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
              STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
            else
              STORE_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
            fi
            KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$STORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-cupido-key}"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Cupido Leudy, OU=Mobile, O=Cupido Leudy, L=Santo Domingo, ST=Distrito Nacional, C=DO"
            GENERATED="true"
          fi

          base64 -w0 "$KEYSTORE_PATH" > android/app/release.keystore.base64
          printf '%s\n' "$STORE_PASSWORD" > android/app/release.keystore.password
          printf '%s\n' "$KEY_ALIAS" > android/app/release.keystore.alias

          {
            printf 'path=%s\n' "$KEYSTORE_PATH"
            printf 'password=%s\n' "$STORE_PASSWORD"
            printf 'alias=%s\n' "$KEY_ALIAS"
            printf 'key-password=%s\n' "$KEY_PASSWORD"
            printf 'generated=%s\n' "$GENERATED"
          } >> "$GITHUB_OUTPUT"

      - name: Upload keystore backup
        if: ${{ steps.keystore.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cupido-leudy-keystore-respaldo
          path: |
            android/app/release.keystore
            android/app/release.keystore.base64
            android/app/release.keystore.password
            android/app/release.keystore.alias
          if-no-files-found: error

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.password }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.key-password }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupido-leudy-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
